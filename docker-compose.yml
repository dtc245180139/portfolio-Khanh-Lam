version: '3.3'

services:
  db:
    image: mysql:8.0
    container_name: db_portfolio
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123!@#
      MYSQL_DATABASE: portfolio_db
      MYSQL_USER: portfolio_user
      MYSQL_PASSWORD: UserPassword123!@#
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma_portfolio
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: RootPassword123!@#
    networks:
      - backend_net

  app:
    image: php:8.2-apache
    container_name: app_portfolio
    restart: always
    volumes:
      - ./src:/var/www/html
    networks:
      - backend_net

  nginx:
    image: nginx:alpine
    container_name: nginx_portfolio
    restart: always
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend_net
    depends_on:
      - app
      - phpmyadmin

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_portfolio
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - backend_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_portfolio
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - backend_net
    depends_on:
      - prometheus
      - loki

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor_portfolio
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend_net

  loki:
    image: grafana/loki:2.9.0
    container_name: loki_portfolio
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend_net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail_portfolio
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - backend_net
    depends_on:
      - loki

volumes:
  db_data:

networks:
  backend_net:
    driver: bridge
